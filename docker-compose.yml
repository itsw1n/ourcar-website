# Base / production composition.
# Dev: `docker compose up` auto-includes docker-compose.override.yml (HTTP, hot reload).
# Prod: `make docker-prod` (uses docker-compose.prod.yml, TLS-ready).

services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE}
    env_file: .env.prod
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
    expose:
      - '3000'

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
