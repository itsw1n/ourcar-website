# Dev overrides — auto-applied by `docker compose up` (no -f needed).
# Runs the app with hot reload (next dev) on the host network so it can reach
# the locally CLI-managed Supabase stack at 127.0.0.1:54321. nginx proxies :80.

services:
  app:
    build:
      target: dev
    # Dev uses local Supabase (CLI-managed), NOT .env.prod. Clear it so the
    # placeholder service-role key doesn't leak into the container.
    env_file: []
    network_mode: host
    command: npx next dev --hostname 0.0.0.0 -p 3000
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
      - NEXT_PUBLIC_SUPABASE_ANON_KEY
      - NEXT_PUBLIC_DATA_SOURCE=supabase
      - SUPABASE_SERVICE_ROLE_KEY
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  nginx:
    network_mode: host
    ports: []
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
